name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nginx_version:
          - "1.26.3"
          - "1.28.3"
          - "1.29.8"

    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build docker image
        run: docker compose build

      - name: Lint code
        run: |
          docker compose run --rm dev make format
          git diff --exit-code -- *.c

      - name: Run tests
        run: docker compose run --rm dev make test

  debian-package:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            debhelper \
            devscripts \
            fakeroot \
            nginx-core \
            nginx-dev \
            python3

      - name: Build Debian source package
        run: dpkg-buildpackage -S -us -uc

      - name: Build Debian binary package
        run: dpkg-buildpackage -b -us -uc

      - name: Install built module package
        run: |
          sudo apt-get install -y ../libnginx-mod-http-cache-pilot_*_$(dpkg --print-architecture).deb

      - name: Run package smoke test
        run: sudo ./debian/tests/smoke

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-artifacts
          path: |
            ../libnginx-mod-http-cache-pilot_*.buildinfo
            ../libnginx-mod-http-cache-pilot_*.changes
            ../libnginx-mod-http-cache-pilot_*.deb
            ../libnginx-mod-http-cache-pilot_*.dsc
            ../libnginx-mod-http-cache-pilot_*.tar.*
          if-no-files-found: error
